name: Integrated HTTPS and PostgreSQL gate (synthetic only)
on:
  pull_request:
    branches: [qa/customer-search-ui-20261114]
    paths:
      - '.github/workflows/integrated-gate.yml'
      - 'scripts/qa-integrated*'
      - 'tests/integrated-gate-contract.test.mjs'
      - 'tests/integrated-gate-cleanup.test.mjs'
permissions:
  contents: read
concurrency:
  group: integrated-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  integrated:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Record exact public candidate and tested merge
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$EXPECTED_BASE" = 8331d3f8847d30fdc3295602127559695911c3c0
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^1^{tree})" = 279f9267221a3dede07de1b74007e38342af98ff
          git show -s --format='tested-merge=%H tree=%T parents=%P'
          git diff --name-only HEAD^1 HEAD | while read -r path; do
            case "$path" in
              .github/workflows/integrated-gate.yml|scripts/qa-integrated.mjs|scripts/qa-integrated-runner.sh|scripts/qa-integrated-cert.py|tests/integrated-gate-contract.test.mjs|tests/integrated-gate-cleanup.test.mjs) ;;
              *) echo 'Unexpected product/config change'; exit 1;;
            esac
          done
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
      - name: Locked dependencies (no lifecycle hooks)
        timeout-minutes: 10
        run: bash scripts/ci-check.sh install
      - name: Harness contract and real application artifact
        timeout-minutes: 5
        run: |
          node --test tests/integrated-gate-contract.test.mjs tests/integrated-gate-cleanup.test.mjs
          bash scripts/ci-check.sh synthetic
      - name: Official NSS CLI if missing
        timeout-minutes: 2
        run: |
          if ! command -v certutil >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libnss3-tools
          fi
      - name: Dedicated-user TLS and real PostgreSQL journey
        timeout-minutes: 12
        run: |
          sudo env -i PATH="$PATH" GITHUB_ACTIONS=true RUNNER_OS=Linux RUNNER_ENVIRONMENT=github-hosted \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            bash scripts/qa-integrated-runner.sh run
      - name: Idempotent final cleanup (including interrupted provisioning)
        if: always()
        timeout-minutes: 2
        run: |
          sudo env -i PATH="$PATH" GITHUB_ACTIONS=true RUNNER_OS=Linux RUNNER_ENVIRONMENT=github-hosted \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            bash scripts/qa-integrated-runner.sh cleanup
