services:
  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["integrations"]
    environment:
      POSTGRES_DB: lzr_hub
      POSTGRES_USER: lzr
      POSTGRES_PASSWORD: local-development-only
    ports: ["5433:5432"]
    volumes: ["lzr_postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:7.4-alpine
    profiles: ["integrations"]
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6380:6379"]
    volumes: ["lzr_redis:/data"]
volumes:
  lzr_postgres:
  lzr_redis:
