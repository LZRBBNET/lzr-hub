services:
  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["integrations"]
    environment:
      POSTGRES_DB: lzr_hub
      POSTGRES_USER: lzr
      POSTGRES_PASSWORD: local-development-only
    ports: ["5433:5432"]
    volumes: ["lzr_postgres:/var/lib/postgresql/data"]

  redis:
    image: redis:7.4-alpine
    profiles: ["integrations"]
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6380:6379"]
    volumes: ["lzr_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  queue-api:
    image: lzr-hub/queue-runtime:0.1.0
    build:
      context: ./services/queue-runtime
    profiles: ["integrations"]
    command: ["node", "src/server.mjs"]
    environment: &queue_environment
      FEATURE_QUEUES: "true"
      REDIS_URL: redis://redis:6379/0
      QUEUE_SERVICE_SECRET: local-development-secret-change-me-123456
      QUEUE_PREFIX: lzr-local
      QUEUE_WORKER_CONCURRENCY: "5"
    ports: ["127.0.0.1:8790:8790"]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  queue-worker:
    image: lzr-hub/queue-runtime:0.1.0
    build:
      context: ./services/queue-runtime
    profiles: ["integrations"]
    command: ["node", "src/worker.mjs"]
    environment: *queue_environment
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  lzr_postgres:
  lzr_redis:
